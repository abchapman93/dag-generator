<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dag-generator</title>
<link rel="stylesheet" href="/kit/ask-cards.css">
<link rel="stylesheet" href="/kit/rail.css">
<link rel="stylesheet" href="/kit/channel-picker.css">
<link rel="stylesheet" href="/dg.css">
</head>
<body>
<div id="dg-stage"></div>
<script type="module">
  import { mount } from '/app.mjs';
  // ?config=<slug> opens a saved DAG on load — how `dag open` hands one to the page.
  const config = new URLSearchParams(location.search).get('config');
  mount({ stage: document.getElementById('dg-stage'), config });
</script>
<script>
// A Home Screen shortcut runs full screen with no browser back button: offer a way back to the Hub.
(function () {
  if (window.top !== window) return;
  if (!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))) return;
  // Desktop web apps (Safari Dock, Chrome) count as standalone too but have their own buttons.
  if (!matchMedia('(hover: none)').matches) return;
  var a = document.createElement('a');
  a.href = 'https://' + location.hostname + ':4710/';
  a.textContent = '\u2039 Hub';
  a.setAttribute('aria-label', 'Back to Hub');
  a.style.cssText = 'position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:2147483647;' +
    'padding:8px 12px;border-radius:18px;background:rgba(30,41,59,.82);color:#fff;' +
    'font:600 15px/1 -apple-system,BlinkMacSystemFont,sans-serif;text-decoration:none;';
  document.body.appendChild(a);
})();
</script>
</body>
</html>
